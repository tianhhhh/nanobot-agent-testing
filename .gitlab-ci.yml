stages:
  - test
  - report
  - notify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NANOBOT_VERSION: "0.3.0"
  ALLURE_VERSION: "2.46.1"

default:
  interruptible: true
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/

.python_test:
  image: python:3.12-slim
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install "nanobot-ai[api]==${NANOBOT_VERSION}"

api_tests:
  extends: .python_test
  variables:
    SERVICE_LOG_DIR: reports/api-logs
  script:
    - mkdir -p ci-status
    - set +e
    - python -m pytest -m api --alluredir=reports/allure-results-api --clean-alluredir --output=test-results-api
    - test_exit=$?
    - set -e
    - if [ "$test_exit" -eq 0 ]; then echo passed > ci-status/api.txt; else echo failed > ci-status/api.txt; fi
    - exit "$test_exit"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-status/api.txt
      - reports/allure-results-api/
      - reports/api-logs/

ui_tests:
  extends: .python_test
  variables:
    SERVICE_LOG_DIR: reports/ui-logs
  before_script:
    - !reference [.python_test, before_script]
    - python -m playwright install --with-deps --no-shell chromium
  script:
    - mkdir -p ci-status
    - set +e
    - python -m pytest -m ui --alluredir=reports/allure-results-ui --clean-alluredir --output=test-results-ui
    - test_exit=$?
    - set -e
    - if [ "$test_exit" -eq 0 ]; then echo passed > ci-status/ui.txt; else echo failed > ci-status/ui.txt; fi
    - exit "$test_exit"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-status/ui.txt
      - reports/allure-results-ui/
      - reports/ui-logs/
      - test-results-ui/

allure_report:
  image: eclipse-temurin:17-jre-jammy
  stage: report
  when: always
  dependencies:
    - api_tests
    - ui_tests
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends curl jq
    - curl --fail --show-error --location "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" --output /tmp/allure.tgz
    - tar --extract --gzip --file /tmp/allure.tgz --directory /opt
  script:
    - mkdir -p reports ci-status reports/allure-results-api reports/allure-results-ui
    - printf 'ALLURE_REPORT_URL=%s\n' "$CI_JOB_URL/artifacts/file/reports/allure-report/index.html" > reports/report.env
    - jq -n --arg name "GitLab CI" --arg type "gitlab" --arg buildName "$CI_PROJECT_PATH #$CI_PIPELINE_IID" --arg buildUrl "$CI_PIPELINE_URL" --arg reportUrl "$CI_JOB_URL/artifacts/file/reports/allure-report/index.html" '{name:$name,type:$type,buildName:$buildName,buildUrl:$buildUrl,reportUrl:$reportUrl}' > reports/allure-results-api/executor.json
    - set +e
    - /opt/allure-${ALLURE_VERSION}/bin/allure generate reports/allure-results-api reports/allure-results-ui --clean --output reports/allure-report
    - report_exit=$?
    - set -e
    - if [ "$report_exit" -eq 0 ]; then echo passed > ci-status/report.txt; else echo failed > ci-status/report.txt; fi
    - exit "$report_exit"
  artifacts:
    when: always
    expire_in: 14 days
    expose_as: Allure Report
    paths:
      - ci-status/
      - reports/allure-results-api/
      - reports/allure-results-ui/
      - reports/allure-report/
      - reports/report.env
    reports:
      dotenv: reports/report.env

feishu_notify:
  image: python:3.12-slim
  stage: notify
  when: always
  allow_failure: true
  dependencies:
    - api_tests
    - ui_tests
    - allure_report
  script:
    - python scripts/notify_feishu.py
