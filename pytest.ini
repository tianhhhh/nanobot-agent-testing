[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --browser=chromium
    --browser-channel=chromium
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results
markers =
    api: OpenAI-compatible API black-box tests
    ui: browser end-to-end tests
    smoke: core happy-path checks
    known_bug: regression test for a recorded product bug
