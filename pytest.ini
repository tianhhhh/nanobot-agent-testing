[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    --browser=chromium
    --browser-channel=chromium
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results
markers =
    api: OpenAI-compatible API black-box tests
    ui: browser end-to-end tests
    smoke: core happy-path checks
    regression: normal, exception, and boundary regression tests
    security: authentication and authorization boundary tests
    known_bug: regression test for a recorded product bug
    resilience: timeout, dependency failure, interruption, and recovery tests
    concurrency: concurrent request and session isolation tests
